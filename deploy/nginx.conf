# Account and chat adaptation of my-note-app/nginx.config.file.
# /api/* stays on Next.js so the refresh token remains HttpOnly.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # OAuth callback query strings contain short-lived codes; do not log queries or referrers.
    log_format app '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
    access_log /dev/stdout app;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 6m;
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 210s;
            proxy_buffering off;
        }
    }
}
